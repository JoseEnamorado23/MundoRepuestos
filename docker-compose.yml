name: mundorepuestos

services:
  db:
    image: postgres:16
    container_name: mundorepuestos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: America/Bogota
      PGTZ: America/Bogota
    ports:
      - "${DB_PORT:-5460}:5432"
    volumes:
      - mundorepuestos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: mundorepuestos-adminer
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "${ADMINER_PORT:-8080}:8080"

  # Worker de facturación electrónica (envía a la DIAN vía Factus los documentos `pendiente_envio`).
  # Perfil "app": `docker compose --profile app up -d worker-fiscal`. Requiere NODO_ID/MODE y FACTUS_* en .env.
  worker-fiscal:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mundorepuestos-worker-fiscal
    profiles: ["app"]
    restart: unless-stopped
    command: ["python", "-m", "app.workers.fiscal"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_DIR: /data/media
    volumes:
      - mundorepuestos_media:/data/media

volumes:
  mundorepuestos_pgdata:
  mundorepuestos_media:
