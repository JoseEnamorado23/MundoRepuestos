[project]
name = "mundorepuestos-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "sqlalchemy>=2.0",
    "truststore>=0.10.5",
    "uuid-utils>=1.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["factus: pruebas contra el sandbox real de Factus (se omiten sin credenciales en .env)"]
filterwarnings = ["ignore:Cannot correctly sort tables:sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["UP", "I", "B"]  # plantilla de Alembic: se conserva su estilo de tipos e imports
"tests/test_catalogo_0008.py" = ["F811"]  # fixtures importadas de test_api_catalogo
